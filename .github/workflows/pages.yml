name: Publish registry to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run registry:build
      - run: npm run build
        env: { BASE_PATH: / }
      # vite copies public/ (r/, themes/, llms.txt, TASTE.md) into dist; fail if the registry is not there
      - run: test -f dist/r/registry.json && test -f dist/r/theme.json && test -f dist/themes/pyospect.md && test -f dist/TASTE.md && test -f dist/llms.txt
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
